# Local development / dogfood via Docker Compose.
#
# Defaults to deterministic MOCK mode (no MiniMax key required). To run against
# the real MiniMax H3 API, set PROVIDER_MODE=minimax and provide MINIMAX_API_KEY
# (preferably via a secrets manager / .env that is never committed).
services:
  h3-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: h3-prompt-studio:latest
    container_name: h3-prompt-studio
    ports:
      - "3001:3001"
    environment:
      PROVIDER_MODE: ${PROVIDER_MODE:-mock}
      SEED_SAMPLES: "true"
      POLL_INTERVAL_MS: "2000"
      # MINIMAX_API_KEY: set only when PROVIDER_MODE=minimax (via secrets).
    volumes:
      - h3-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  h3-data:
