apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jcode
# NOTE: no Secret is applied here. A committed empty MiniMax secret would risk
# overwriting an operator's real credential on `kubectl apply -k`, so the secret
# is created out-of-band and only when running in real (minimax) mode (see
# README). In mock mode the Deployment's secretRef is `optional: true` and the
# pod starts with no secret present.
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
commonLabels:
  app.kubernetes.io/part-of: h3-prompt-studio
